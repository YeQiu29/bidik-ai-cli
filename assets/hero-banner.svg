<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1a1033"/>
    </linearGradient>

    <linearGradient id="neonTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4">
        <animate attributeName="stop-color" values="#00f5d4;#00bbf9;#9b5de5;#00f5d4" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#00bbf9">
        <animate attributeName="stop-color" values="#00bbf9;#9b5de5;#00f5d4;#00bbf9" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#9b5de5">
        <animate attributeName="stop-color" values="#9b5de5;#00f5d4;#00bbf9;#9b5de5" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#00bbf9" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#9b5de5" stop-opacity="0.25"/>
    </linearGradient>

    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00f5d4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9b5de5" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#9b5de5" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.5"/>
    </pattern>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .title {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 900;
      font-size: 64px;
      letter-spacing: 6px;
    }
    .subtitle {
      font-family: 'Cascadia Code', 'Fira Code', Consolas, monospace;
      font-size: 17px;
      fill: #cbd5e1;
    }
    .pill-text {
      font-family: 'Cascadia Code', Consolas, monospace;
      font-size: 13px;
      fill: #00f5d4;
      font-weight: 600;
    }
    .cursor {
      animation: blink 1s step-end infinite;
    }
    .scanline {
      animation: scan 5s linear infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes scan {
      0% { transform: translateY(-300px); opacity: 0; }
      20% { opacity: 0.35; }
      80% { opacity: 0.35; }
      100% { transform: translateY(320px); opacity: 0; }
    }
  </style>

  <!-- Background & Grid -->
  <rect width="1000" height="300" rx="18" fill="url(#bgGrad)"/>
  <rect width="1000" height="300" rx="18" fill="url(#grid)"/>

  <!-- Animated Ambient Glow Orbs -->
  <circle cx="220" cy="120" r="180" fill="url(#glowCyan)">
    <animate attributeName="cx" values="200;290;200" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="110;150;110" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="780" cy="170" r="190" fill="url(#glowPurple)">
    <animate attributeName="cx" values="800;710;800" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="180;120;180" dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- Subtle Horizontal Scanline -->
  <rect class="scanline" x="0" y="0" width="1000" height="2" fill="#00bbf9"/>

  <!-- Floating Cyber Particles -->
  <circle cx="120" cy="70" r="2.5" fill="#00f5d4">
    <animate attributeName="cy" values="75;45;75" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="880" cy="85" r="3" fill="#00bbf9">
    <animate attributeName="cy" values="85;55;85" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="165" cy="220" r="2" fill="#9b5de5">
    <animate attributeName="cy" values="220;190;220" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="835" cy="215" r="2.5" fill="#00f5d4">
    <animate attributeName="cy" values="215;180;215" dur="4.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Animated Bottom Wave -->
  <path fill="url(#waveGrad1)">
    <animate attributeName="d" dur="7s" repeatCount="indefinite"
      values="
        M0,250 Q250,215 500,250 T1000,245 L1000,300 L0,300 Z;
        M0,245 Q250,280 500,240 T1000,255 L1000,300 L0,300 Z;
        M0,250 Q250,215 500,250 T1000,245 L1000,300 L0,300 Z"
    />
  </path>

  <!-- Top Status Pill -->
  <g transform="translate(315, 38)">
    <rect width="370" height="30" rx="15" fill="#0f172a" stroke="#00f5d4" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="20" cy="15" r="5" fill="#00f5d4">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="36" y="19" class="pill-text">Powered By Dennis Hilmansyah • Agentic TUI</text>
  </g>

  <!-- Main Glowing Title -->
  <text x="500" y="148" text-anchor="middle" class="title" fill="url(#neonTitle)" filter="url(#softGlow)">
    ⚡ BIDIK CLI
  </text>

  <!-- Terminal Prompt Subtitle with Blinking Cursor -->
  <text x="500" y="192" text-anchor="middle" class="subtitle">
    <tspan fill="#00f5d4" font-weight="bold">❯</tspan>
    <tspan fill="#e2e8f0"> AI Coding Assistant di Terminal Anda • </tspan>
    <tspan fill="#00bbf9">/model</tspan>
    <tspan fill="#94a3b8"> • </tspan>
    <tspan fill="#9b5de5">/resume</tspan>
    <tspan fill="#94a3b8"> • </tspan>
    <tspan fill="#00f5d4">@file</tspan>
    <tspan class="cursor" fill="#00f5d4"> █</tspan>
  </text>

  <!-- Feature Mini Tags -->
  <g transform="translate(215, 218)" font-family="'Segoe UI', sans-serif" font-size="12" fill="#94a3b8">
    <rect x="0" y="0" width="130" height="26" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="65" y="17" text-anchor="middle" fill="#38bdf8">🐍 Python 3.10+</text>

    <rect x="145" y="0" width="145" height="26" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="217" y="17" text-anchor="middle" fill="#a78bfa">🔀 Multi-Model Live</text>

    <rect x="305" y="0" width="130" height="26" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="370" y="17" text-anchor="middle" fill="#34d399">🛡️ Safe .venv</text>

    <rect x="450" y="0" width="125" height="26" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="512" y="17" text-anchor="middle" fill="#fbbf24">📝 Smart Diff</text>
  </g>

  <!-- Border Frame -->
  <rect x="1" y="1" width="998" height="298" rx="18" fill="none" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5"/>
</svg>
