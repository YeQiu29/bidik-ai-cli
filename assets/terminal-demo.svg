<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="100%" height="100%">
  <style>
    .mono {
      font-family: 'Cascadia Code', 'Fira Code', Consolas, monospace;
      font-size: 13.5px;
    }
    .step1 { animation: fade1 14s infinite; }
    .step2 { animation: fade2 14s infinite; }
    .step3 { animation: fade3 14s infinite; }
    .step4 { animation: fade4 14s infinite; }
    .step5 { animation: fade5 14s infinite; }
    .step6 { animation: fade6 14s infinite; }

    @keyframes fade1 {
      0%, 4% { opacity: 0; }
      8%, 94% { opacity: 1; }
      98%, 100% { opacity: 0; }
    }
    @keyframes fade2 {
      0%, 16% { opacity: 0; }
      21%, 94% { opacity: 1; }
      98%, 100% { opacity: 0; }
    }
    @keyframes fade3 {
      0%, 32% { opacity: 0; }
      37%, 94% { opacity: 1; }
      98%, 100% { opacity: 0; }
    }
    @keyframes fade4 {
      0%, 48% { opacity: 0; }
      53%, 94% { opacity: 1; }
      98%, 100% { opacity: 0; }
    }
    @keyframes fade5 {
      0%, 64% { opacity: 0; }
      69%, 94% { opacity: 1; }
      98%, 100% { opacity: 0; }
    }
    @keyframes fade6 {
      0%, 78% { opacity: 0; }
      83%, 94% { opacity: 1; }
      98%, 100% { opacity: 0; }
    }
  </style>

  <!-- Terminal Window Shadow & Body -->
  <rect x="4" y="4" width="912" height="462" rx="14" fill="#0b0f19" stroke="#334155" stroke-width="1.5"/>

  <!-- Top Titlebar -->
  <rect x="5" y="5" width="910" height="38" rx="13" fill="#161e2e"/>
  <rect x="5" y="28" width="910" height="15" fill="#161e2e"/>
  <line x1="5" y1="43" x2="915" y2="43" stroke="#283548" stroke-width="1"/>

  <!-- Window Control Dots -->
  <circle cx="28" cy="24" r="6" fill="#ff5f56"/>
  <circle cx="48" cy="24" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="24" r="6" fill="#27c93f"/>
  <text x="460" y="28" text-anchor="middle" class="mono" fill="#94a3b8" font-size="12.5">
    ⚡ PowerShell — bidik (C:\Projects\backend-api)
  </text>

  <!-- Step 1: Launch bidik & Status Card -->
  <g class="step1 mono">
    <text x="28" y="72" fill="#94a3b8">PS C:\Projects\backend-api&gt; <tspan fill="#00f5d4" font-weight="bold">bidik</tspan></text>
    <rect x="28" y="84" width="864" height="62" rx="8" fill="#111827" stroke="#00bbf9" stroke-width="1" stroke-opacity="0.6"/>
    <text x="44" y="106" fill="#7aa2f7">Server AI   : <tspan fill="#00f5d4" font-weight="bold">● Terhubung</tspan><tspan fill="#94a3b8"> (http://192.168.6.217:20128/v1 • 12 ms • 69 model aktif)</tspan></text>
    <text x="44" y="128" fill="#7aa2f7">Model &amp; Mode: <tspan fill="#00bbf9" font-weight="bold">bidik_ai</tspan><tspan fill="#94a3b8">  •  </tspan><tspan fill="#00f5d4" font-weight="bold">⚡ AGENT</tspan><tspan fill="#64748b">  (Ketik / untuk menu • /model ganti AI • @ sebut file)</tspan></text>
  </g>

  <!-- Step 2: Slash Command /model Interactive Picker -->
  <g class="step2 mono">
    <text x="28" y="172">
      <tspan fill="#00f5d4" font-weight="bold">bidik</tspan><tspan fill="#e2e8f0">(</tspan><tspan fill="#9b5de5" font-weight="bold">AGENT</tspan><tspan fill="#e2e8f0">:</tspan><tspan fill="#00bbf9">bidik_ai</tspan><tspan fill="#e2e8f0">) </tspan><tspan fill="#00f5d4">❯ </tspan><tspan fill="#ffffff">/model</tspan>
    </text>
    <rect x="28" y="182" width="864" height="54" rx="6" fill="#161b2c" stroke="#3b4261"/>
    <rect x="34" y="188" width="852" height="22" rx="4" fill="#00bbf9"/>
    <text x="44" y="204" fill="#0b0f19" font-weight="bold">❯ ● gemini/gemini-4-hydrogen          ✨ GEMINI        1M ctx   [Tools/Think/Vision]</text>
    <text x="44" y="226" fill="#cbd5e1">    bidik_ai                          ⭐ COMBO         256K ctx [Tools/Think/Vision]</text>
  </g>

  <!-- Step 3: User Coding Request with @file -->
  <g class="step3 mono">
    <text x="28" y="262">
      <tspan fill="#00f5d4" font-weight="bold">bidik</tspan><tspan fill="#e2e8f0">(</tspan><tspan fill="#9b5de5" font-weight="bold">AGENT</tspan><tspan fill="#e2e8f0">:</tspan><tspan fill="#00bbf9">gemini-4-hydrogen</tspan><tspan fill="#e2e8f0">) </tspan><tspan fill="#00f5d4">❯ </tspan><tspan fill="#ffffff">cek dan perbaiki validasi token kosong di </tspan><tspan fill="#38bdf8" font-weight="bold">@auth.py</tspan>
    </text>
  </g>

  <!-- Step 4: Thinking & Tool Execution -->
  <g class="step4 mono">
    <text x="36" y="288" fill="#a78bfa" font-style="italic">💭 Berpikir: Memeriksa pengecekan Bearer token dan menangani nilai kosong di auth.py...</text>
    <text x="36" y="310" fill="#94a3b8">📎 Melampirkan &amp; membaca file: <tspan fill="#38bdf8">auth.py</tspan> (baris 1-48)</text>
  </g>

  <!-- Step 5: Unified Diff Preview -->
  <g class="step5 mono">
    <rect x="28" y="322" width="864" height="66" rx="8" fill="#0f172a" stroke="#4ea8de" stroke-width="1"/>
    <text x="44" y="342" fill="#38bdf8" font-weight="bold">📝 Diff Perubahan: auth.py</text>
    <text x="44" y="361" fill="#ff6b6b">-   if token == "": return True</text>
    <text x="44" y="379" fill="#00f5d4">+   if not token or not verify_signature(token): raise UnauthorizedError("Invalid token")</text>
  </g>

  <!-- Step 6: Final Success & Summary Box -->
  <g class="step6 mono">
    <rect x="28" y="400" width="864" height="44" rx="8" fill="#111827" stroke="#00f5d4" stroke-width="1.2"/>
    <text x="44" y="427" fill="#e2e8f0">
      <tspan fill="#00f5d4" font-weight="bold">✔ Berhasil diedit: auth.py</tspan>
      <tspan fill="#94a3b8"> — Celah autentikasi saat token kosong sudah diperbaiki &amp; diverifikasi.</tspan>
    </text>
  </g>

  <!-- Bottom Status Bar -->
  <rect x="5" y="446" width="910" height="19" rx="6" fill="#161e2e"/>
  <text x="24" y="459" class="mono" font-size="11.5" fill="#94a3b8">
    ⚡ AGENT │ 🤖 gemini/gemini-4-hydrogen │ 🕒 Cache: 3/20 sesi (auto-cleanup) │ in:1,420 • out:185 tok
  </text>
</svg>
